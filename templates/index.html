<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Frutas</title>
    <style>
        table, td, tr{
            width: 80%;
            border: 1px solid black;
            border-collapse: collapse;
        }
        .btnTd{
            display: flex;
            flex-direction: row;
            margin: 4px;
            padding: 5px;
            border-collapse: collapse;

        }
        .btnTd button{
            margin: 3px;
            border: none;
            font-size: 17px;
            padding: 2px;
        }

        .modal{
            display: none;
            z-index: 1;
            width: 100%;
            height: 100%;
            
            position: fixed;
            left: 0;
            top: 0;
            
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.5);
           
        }
        #formulario{
            
            width: 70%;
            height: 50%;
            box-shadow: 5px 4px 4px rgba(0, 0, 0, 0.555);
            border-radius: 10px;
            background-color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        input, .input{
            margin: 5px;
            height: 25px;
        }

        .close:hover, .close:focus{
            cursor: pointer;
            color: red;
        }
    </style>
</head>
<body>
    <div id="MyModal" class="modal">
        <form id="formulario">
            
            <span class="close">&times;</span>
            <h1>Adicionar fruta</h1>
            <input type="text" name="fruta" id="fruta" placeholder="Digite o nome">

            <input type="text" name="quantidade" id="quatd" placeholder="Digite a quantidade das caixas em texto">
            <button type="submit" id="btForm" class="input">Salvar</button>


        </form>
    </div><!--modal-->

    <main>
        <h1>
            Frutas e caixas
        </h1>

        <div class="containerFrutas">
            <button id="AddItem">Adicionar</button>
            <table>
                <thead>
                    <th>Frutas</th>
                    <th>Quantidade</th>
                    <th>Ações</th>
                </thead>
                <tbody id="elementos">
                    <tr>
                        <td>
                            Fruta 1
                        </td>
                        <td>
                            18kg
                        </td>
                        <td class="btnTd">
                            <button>Editar</button>
                            <button>Apagar</button>
                        </td>
                    </tr>
                </tbody>
                
            </table>
        </div><!--container frutas-->
    </main>
    <script>
        const tabela = document.getElementById("elementos");

        fetch("http://127.0.0.1:3000/frutas")
        .then(respost => respost.json())
        .then(data =>{
            for(let i = 0; i <= data.length; i++){
                
                let newRow = document.createElement('tr');
                let cel1 = document.createElement('td');
                cel1.textContent = data[i].fruta;
                newRow.appendChild(cel1);

                let cel2 = document.createElement('td')
                cel2.textContent = data[i].quantidade;
                newRow.appendChild(cel2);

                let cel3 = document.createElement('td')
                cel3.classList.add("btnTd")
                cel3.innerHTML = "<button> editar </button> <button> apagar </button>"
                newRow.appendChild(cel3)

                tabela.appendChild(newRow)

            }
            
        })

        const btnAdd = document.getElementById('AddItem');
        const MyModal = document.getElementById('MyModal');
        const closeModal = document.getElementsByClassName('close')[0]

        const frName = document.getElementById('fruta')
        const qtdCx = document.getElementById('quatd')
        const form = document.getElementById('formulario')
        const btform = document.getElementById('btForm');

        btnAdd.addEventListener('click', ()=>{
            MyModal.style.display = "block";
            closeModal.addEventListener('click', ()=>{
                MyModal.style.display = "none";
            })


            window.onclick = event =>{
                if(event.target == MyModal){
                    MyModal.style.display = "none";
                }
            }
        })

        form.onsubmit =  async ()=>{
            let enviar = {fruta : frName.value, quantidade : qtdCx.value}

            if(frName.value != null){
                enviar.fruta = frName.value
            }
            if(qtdCx.value != null){
                enviar.quantidade = qtdCx.value
            }
            
            const init = {
                method: 'POST',
                headers: {
                    'Content-type': 'application/json'
                },
                body: JSON.stringify(enviar)
            }
            
            const response = await fetch("http://localhost:3000/frutas", init)
            if(response.ok){
                console.log("Adicionou")
            }


        }
        

    </script>
</body>
</html>
